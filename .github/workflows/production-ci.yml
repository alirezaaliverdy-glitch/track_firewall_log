name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - product-persian-command-catalog
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_APP_ENV: production
      VITE_BASE_PATH: /firewall/
      VITE_API_BASE_URL: /firewall-api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate frontend environment
        run: pnpm run validate:env:frontend

      - name: TypeScript check
        run: pnpm exec tsc -b

      - name: Build frontend
        run: pnpm run build

      - name: Frontend smoke tests
        run: pnpm run test:smoke:frontend

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  backend:
    name: Backend typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Validate backend environment
        working-directory: backend
        run: pnpm run validate:env

      - name: Generate Prisma client
        working-directory: backend
        run: pnpm run prisma:generate

      - name: Build backend
        working-directory: backend
        run: pnpm run build

      - name: Backend smoke tests
        working-directory: backend
        run: pnpm run test:smoke

      - name: Validate command catalog
        working-directory: backend
        run: pnpm run validate:command-catalog

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist-${{ github.sha }}
          path: backend/dist/
          if-no-files-found: error
          retention-days: 14

  compose:
    name: Docker Compose syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate compose files
        env:
          DEPLOY_VERSION: ci-${{ github.sha }}
          FRONTEND_IMAGE: ghcr.io/example/firewall/frontend:ci-${{ github.sha }}
          BACKEND_IMAGE: ghcr.io/example/firewall/backend:ci-${{ github.sha }}
          DATABASE_URL: postgresql://firewall_app:ci-password@firewall-db:5432/firewall_log_analyzer
          CORS_ORIGIN: https://firewall.example.invalid
          CREDENTIAL_ENCRYPTION_KEY: ci-placeholder-key-with-at-least-32-characters
          ADMIN_PASSWORD: ci-placeholder-password
          AUTH_SESSION_SECRET: ci-placeholder-secret-with-at-least-32-chars
          POSTGRES_PASSWORD: ci-placeholder-db-password
        run: |
          docker compose -f docker-compose.yml config
          docker compose -f docker-compose.development.yml config
          docker compose -f docker-compose.staging.yml config
          docker compose -f docker-compose.production.yml config
          docker compose -f docker-compose.firewall.yml config

  deploy-production:
    name: Deploy latest main to production server
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [frontend, backend, compose]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    concurrency:
      group: production-server-deploy
      cancel-in-progress: false

    steps:
      - name: Check out the verified commit
        uses: actions/checkout@v4

      - name: Configure pinned SSH access
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
          SSH_PORT: ${{ vars.PRODUCTION_SSH_PORT }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Set PRODUCTION_SSH_HOST in the production environment}"
          : "${SSH_USER:?Set PRODUCTION_SSH_USER in the production environment}"
          : "${SSH_KEY:?Set PRODUCTION_SSH_KEY in the production environment}"
          : "${SSH_KNOWN_HOSTS:?Set PRODUCTION_SSH_KNOWN_HOSTS to the verified server host key}"
          SSH_PORT="${SSH_PORT:-22}"
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] && (( SSH_PORT > 0 && SSH_PORT < 65536 ))
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          ssh-keygen -lf ~/.ssh/known_hosts >/dev/null
          printf 'SSH_PORT=%s\n' "$SSH_PORT" >> "$GITHUB_ENV"

      - name: Deploy only the commit that passed CI
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${DEPLOY_PATH:?Set PRODUCTION_DEPLOY_PATH in the production environment}"
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          ssh -p "$SSH_PORT" \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$SSH_USER@$SSH_HOST" \
            "sh -s -- '$DEPLOY_PATH' '$DEPLOY_SHA'" < scripts/deploy/update-main-server.sh
