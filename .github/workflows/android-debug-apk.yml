name: Android Release Candidate Artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - product-persian-command-catalog
    paths:
      - ".github/workflows/android-debug-apk.yml"
      - "android/**"
      - "plugins/**/android/**"
      - "src/**"
      - "public/**"
      - "capacitor.config.ts"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - "vite.config.ts"
  pull_request:
    paths:
      - ".github/workflows/android-debug-apk.yml"
      - "android/**"
      - "plugins/**/android/**"
      - "src/**"
      - "public/**"
      - "capacitor.config.ts"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - "vite.config.ts"

permissions:
  contents: read

jobs:
  android-rc:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      FIREWALL_RELEASE_STORE_FILE: android/app/firewall-release.jks
      HAS_RELEASE_SIGNING: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 != '' && secrets.ANDROID_RELEASE_STORE_PASSWORD != '' && secrets.ANDROID_RELEASE_KEY_ALIAS != '' && secrets.ANDROID_RELEASE_KEY_PASSWORD != '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets
        run: pnpm run build

      - name: Sync Capacitor Android project
        run: pnpm exec cap sync android

      - name: Guard generated Cordova post-build hook
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("android/capacitor-cordova-android-plugins/build.gradle")
          if not path.exists():
              print(f"{path} was not generated; nothing to guard")
              raise SystemExit(0)

          text = path.read_text()
          guarded = """if (!project.ext.has("cdvPluginPostBuildExtras")) {
              project.ext.cdvPluginPostBuildExtras = []
          }

          project.ext.cdvPluginPostBuildExtras.each { callback ->
              callback.call()
          }
          """
          if "project.ext.cdvPluginPostBuildExtras.each" in text:
              print("Generated Cordova post-build hook is already guarded")
              raise SystemExit(0)

          pattern = re.compile(
              r"for\s*\(\s*def\s+func\s*:\s*cdvPluginPostBuildExtras\s*\)\s*\{\s*func\(\)\s*\}",
              re.MULTILINE,
          )
          updated, count = pattern.subn(guarded, text)
          if count:
              path.write_text(updated)
              print("Guarded generated Cordova post-build hook")
              raise SystemExit(0)

          if "cdvPluginPostBuildExtras" in text:
              raise SystemExit("Found cdvPluginPostBuildExtras but did not recognize the unsafe loop shape")

          print("No generated Cordova post-build hook found")
          PY

      - name: Clear generated Gradle problem reports
        run: rm -rf android/build/reports/problems

      - name: Show Gradle version
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew --version

      - name: Run Android unit tests
        run: |
          cd android
          ./gradlew testDebugUnitTest --stacktrace

      - name: Clear generated Gradle problem reports
        run: rm -rf android/build/reports/problems

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Generate debug APK SHA-256
        run: sha256sum android/app/build/outputs/apk/debug/app-debug.apk | tee android/app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Decode release keystore
        if: env.HAS_RELEASE_SIGNING == 'true'
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$FIREWALL_RELEASE_STORE_FILE"

      - name: Build release AAB
        if: env.HAS_RELEASE_SIGNING == 'true'
        env:
          FIREWALL_RELEASE_STORE_FILE: app/firewall-release.jks
          FIREWALL_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          FIREWALL_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          FIREWALL_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease --stacktrace

      - name: Build unsigned release AAB
        if: env.HAS_RELEASE_SIGNING != 'true'
        run: |
          cd android
          ./gradlew bundleRelease --stacktrace

      - name: Generate release AAB SHA-256
        run: sha256sum android/app/build/outputs/bundle/release/app-release.aab | tee android/app/build/outputs/bundle/release/app-release.aab.sha256

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: firewall-soar-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: firewall-soar-release-aab
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/bundle/release/app-release.aab.sha256
          if-no-files-found: error

      - name: Upload Android test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/tests/
            plugins/local-ssh/android/build/reports/tests/
          if-no-files-found: ignore
