name: Android Release Candidate Artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - product-persian-command-catalog
    paths:
      - ".github/workflows/android-debug-apk.yml"
      - "android/**"
      - "plugins/**/android/**"
      - "src/**"
      - "public/**"
      - "capacitor.config.ts"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - "vite.config.ts"
  pull_request:
    paths:
      - ".github/workflows/android-debug-apk.yml"
      - "android/**"
      - "plugins/**/android/**"
      - "src/**"
      - "public/**"
      - "capacitor.config.ts"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - "vite.config.ts"

permissions:
  contents: read

jobs:
  android-rc:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      FIREWALL_RELEASE_STORE_FILE: android/app/firewall-release.jks
      HAS_RELEASE_SIGNING: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 != '' && secrets.ANDROID_RELEASE_STORE_PASSWORD != '' && secrets.ANDROID_RELEASE_KEY_ALIAS != '' && secrets.ANDROID_RELEASE_KEY_PASSWORD != '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets
        run: pnpm run build

      - name: Sync Capacitor Android project
        run: pnpm exec cap sync android

      - name: Clear generated Gradle problem reports
        run: rm -rf android/build/reports/problems

      - name: Diagnose Google Maven resolution
        run: |
          mkdir -p android/build/diagnostics
          log_file="android/build/diagnostics/android-repository-diagnostics.log"
          exec > >(tee "$log_file") 2>&1

          set +e
          pom_url="https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/8.12.2/gradle-8.12.2.pom"

          echo "== Environment =="
          java -version
          chmod +x ./android/gradlew
          ./android/gradlew --version
          env | grep -Ei 'proxy|gradle|java|android' | sed -E 's#(https?://)[^/@:]+(:[^/@]*)?@#\1***:***@#g; s/(password|passwd|pwd|secret|token|key|credential|authorization)=([^[:space:]]+)/\1=***MASKED***/Ig' || true

          echo "== Google Maven exact AGP POM HEAD =="
          curl -IL --retry 3 "$pom_url"

          echo "== Google Maven exact AGP POM download =="
          curl -fL --retry 3 "$pom_url" -o /tmp/agp-8.12.2.pom
          curl_status=$?
          if [ "$curl_status" -eq 0 ]; then
            wc -c /tmp/agp-8.12.2.pom
            head -n 10 /tmp/agp-8.12.2.pom
          else
            echo "AGP_POM_DOWNLOAD_FAILED=$curl_status"
          fi

          echo "== Effective Gradle repository and proxy configuration =="
          for file in android/settings.gradle android/build.gradle android/gradle.properties "$HOME/.gradle/gradle.properties" "$HOME/.gradle/init.gradle"; do
            echo "--- $file ---"
            if [ -f "$file" ]; then
              sed -E 's/(password|passwd|pwd|secret|token|key|credential|authorization)([[:space:]]*[=:][[:space:]]*).*/\1\2***MASKED***/Ig' "$file"
            else
              echo "missing"
            fi
          done

          echo "--- $HOME/.gradle/init.d ---"
          if [ -d "$HOME/.gradle/init.d" ]; then
            find "$HOME/.gradle/init.d" -maxdepth 1 -type f -print | sort | while read -r init_file; do
              echo "--- $init_file ---"
              sed -E 's/(password|passwd|pwd|secret|token|key|credential|authorization)([[:space:]]*[=:][[:space:]]*).*/\1\2***MASKED***/Ig' "$init_file"
            done
          else
            echo "missing"
          fi

          echo "== Gradle buildEnvironment =="
          cd android
          ./gradlew --stop
          ./gradlew buildEnvironment --refresh-dependencies --stacktrace --info
          build_environment_status=$?

          echo "== Gradle testDebugUnitTest =="
          ./gradlew testDebugUnitTest --refresh-dependencies --stacktrace --info
          unit_test_status=$?

          echo "BUILD_ENVIRONMENT_STATUS=$build_environment_status"
          echo "TEST_DEBUG_UNIT_TEST_STATUS=$unit_test_status"

          if [ "$curl_status" -ne 0 ] || [ "$build_environment_status" -ne 0 ] || [ "$unit_test_status" -ne 0 ]; then
            exit 1
          fi

      - name: Run Android unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Clear generated Gradle problem reports
        run: rm -rf android/build/reports/problems

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Generate debug APK SHA-256
        run: sha256sum android/app/build/outputs/apk/debug/app-debug.apk | tee android/app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Decode release keystore
        if: env.HAS_RELEASE_SIGNING == 'true'
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$FIREWALL_RELEASE_STORE_FILE"

      - name: Build release AAB
        if: env.HAS_RELEASE_SIGNING == 'true'
        working-directory: android
        env:
          FIREWALL_RELEASE_STORE_FILE: app/firewall-release.jks
          FIREWALL_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          FIREWALL_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          FIREWALL_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Build unsigned release AAB
        if: env.HAS_RELEASE_SIGNING != 'true'
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace

      - name: Generate release AAB SHA-256
        run: sha256sum android/app/build/outputs/bundle/release/app-release.aab | tee android/app/build/outputs/bundle/release/app-release.aab.sha256

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: firewall-soar-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: firewall-soar-release-aab
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/bundle/release/app-release.aab.sha256
          if-no-files-found: error

      - name: Upload Android test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-gradle-diagnostics
          path: |
            android/build/diagnostics/
            android/build/reports/
            android/app/build/reports/tests/
            android/app/build/reports/
            android/app/build/test-results/
            android/capacitor-cordova-android-plugins/build/reports/
            android/capacitor-cordova-android-plugins/build/test-results/
            plugins/local-ssh/android/build/reports/tests/
            ~/.gradle/daemon/*/*.log
          if-no-files-found: ignore
