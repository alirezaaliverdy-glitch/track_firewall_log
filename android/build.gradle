apply from: "variables.gradle"

ext {
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.1'
    cordovaAndroidVersion = project.hasProperty('cordovaAndroidVersion') ? rootProject.ext.cordovaAndroidVersion : '14.0.1'
}

buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.12.2'
    }
}

apply plugin: 'com.android.library'

android {
    namespace = "capacitor.cordova.android.plugins"
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    buildToolsVersion = project.hasProperty('buildToolsVersion') ? rootProject.ext.buildToolsVersion : '35.0.0'
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
        versionCode 1
        versionName "1.0"
    }
    lintOptions {
        abortOnError = false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(dir: 'src/main/libs', include: ['*.jar'])
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "org.apache.cordova:framework:$cordovaAndroidVersion"
    // SUB-PROJECT DEPENDENCIES START
    
    // SUB-PROJECT DEPENDENCIES END
}

// PLUGIN GRADLE EXTENSIONS START

// PLUGIN GRADLE EXTENSIONS END

if (!project.ext.has("cdvPluginPostBuildExtras")) {
    project.ext.cdvPluginPostBuildExtras = []
}

project.ext.cdvPluginPostBuildExtras.each { callback ->
    callback.call()
}

tasks.register("verifyRootSdkVariables") {
    doLast {
        if (JavaVersion.current() < JavaVersion.VERSION_21) {
            throw new GradleException("Android release candidate requires JDK 21 or newer; current JVM is ${JavaVersion.current()}")
        }

        def variablesFile = rootProject.file("variables.gradle")
        if (!variablesFile.isFile()) {
            throw new GradleException("android/variables.gradle is missing")
        }

        def requiredVariables = [
            "minSdkVersion",
            "compileSdkVersion",
            "targetSdkVersion",
            "buildToolsVersion"
        ]
        requiredVariables.each { name ->
            if (!rootProject.ext.has(name)) {
                throw new GradleException("rootProject.ext.${name} is not defined")
            }
        }

        def rootBuildText = rootProject.file("build.gradle").text
        def applyIndex = rootBuildText.indexOf('apply from: "variables.gradle"')
        if (applyIndex < 0) {
            throw new GradleException("android/build.gradle does not load variables.gradle")
        }

        def firstSdkRead = requiredVariables
            .collect { rootBuildText.indexOf("rootProject.ext.${it}") }
            .findAll { it >= 0 }
            .min()
        if (firstSdkRead != null && applyIndex > firstSdkRead) {
            throw new GradleException("variables.gradle is loaded after rootProject.ext SDK values are read")
        }

        def appBuildText = rootProject.file("app/build.gradle").text
        requiredVariables.each { name ->
            if (!appBuildText.contains("rootProject.ext.${name}")) {
                throw new GradleException("app/build.gradle does not resolve rootProject.ext.${name}")
            }
        }

        def capacitorSettingsText = rootProject.file("capacitor.settings.gradle").text
        if (!capacitorSettingsText.contains("include ':firewallsoar-local-ssh'")) {
            throw new GradleException("Capacitor sync did not include the local SSH Android plugin")
        }

        def capacitorBuildText = rootProject.file("app/capacitor.build.gradle").text
        if (!capacitorBuildText.contains("implementation project(':firewallsoar-local-ssh')")) {
            throw new GradleException("Capacitor sync did not add the local SSH Android dependency")
        }
    }
}
