server {
  listen 50;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; form-action 'self'" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=()" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;

  location = /firewall/assets {
    expires -1;
    try_files /__asset_overview_spa_route__ /firewall/index.html;
  }

  # This SPA route shares the /assets prefix used by Vite bundles, so keep it
  # ahead of the immutable static-asset location for direct links and refreshes.
  location = /firewall/assets/topology {
    expires -1;
    try_files /__asset_topology_spa_route__ /firewall/index.html;
  }

  # Asset workspace routes and Vite bundles intentionally share the
  # /firewall/assets prefix. Extensionless paths are application routes;
  # fingerprinted files continue through the static location below.
  location ~ ^/firewall/assets(?:/[A-Za-z0-9_-]+)*/?$ {
    expires -1;
    try_files /__asset_workspace_spa_route__ /firewall/index.html;
  }

  location = /firewall/manifest.webmanifest {
    alias /usr/share/nginx/html/manifest.webmanifest;
    default_type application/manifest+json;
    expires -1;
  }

  location = /firewall/sw.js {
    alias /usr/share/nginx/html/sw.js;
    default_type application/javascript;
    expires -1;
  }

  location /firewall/assets/ {
    alias /usr/share/nginx/html/assets/;
    expires 1y;
  }

  location /firewall/ {
    alias /usr/share/nginx/html/;
    expires -1;
    try_files $uri /firewall/index.html;
  }
}
