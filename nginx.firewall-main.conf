server {
  listen 80;
  server_name _;

  client_max_body_size 25m;

  location /firewall-api/ {
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_send_timeout 150s;
    proxy_read_timeout 150s;
    # The browser and this gateway share one public origin. Do not forward the
    # external Origin header across the private proxy boundary: otherwise the
    # API mistakes LAN/PWA hosts for cross-origin callers. Cookie mutations
    # still require the per-session CSRF token and the normal RBAC checks.
    proxy_set_header Origin "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://firewall-api:4000/api/;
  }

  location /firewall/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_pass http://firewall-web:50/firewall/;
  }
}
