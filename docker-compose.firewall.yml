services:
  main-nginx:
    image: nginx:1.27-alpine
    container_name: main-nginx
    depends_on:
      firewall-web:
        condition: service_healthy
      firewall-api:
        condition: service_healthy
    ports:
      - "${FIREWALL_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.firewall-main.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/firewall/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  firewall-web:
    image: ${FRONTEND_IMAGE:-firewall-log-analyzer-web:local}
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/firewall/}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/firewall-api}
        VITE_APP_ENV: ${VITE_APP_ENV:-development}
    container_name: firewall-web
    expose:
      - "50"
    labels:
      org.opencontainers.image.revision: ${DEPLOY_VERSION:-local-dev}
      org.opencontainers.image.environment: ${APP_PROFILE:-lab}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:50/firewall/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  firewall-api:
    image: ${BACKEND_IMAGE:-firewall-log-analyzer-api:local}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: firewall-api
    depends_on:
      firewall-db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

    env_file:
      - path: ./backend/.env
      - path: ./.runtime/openrouter-proxy.env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      APP_PROFILE: ${APP_PROFILE:-lab}
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgresql://firewall_app@firewall-db:5432/firewall_log_analyzer}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost,http://127.0.0.1}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      UPLOAD_DIR: /app/storage/uploads
      TELEMETRY_STORE_DIR: /app/storage/telemetry
      OPENAI_FALLBACK_MODELS: ${OPENAI_FALLBACK_MODELS:-nvidia/nemotron-3-super:free,openai/gpt-oss-20b:free,google/gemma-4-31b-it:free}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-30000}
      AI_MAX_CONTEXT_EVENTS: ${AI_MAX_CONTEXT_EVENTS:-25}
      AI_MAX_CONTEXT_INCIDENTS: ${AI_MAX_CONTEXT_INCIDENTS:-10}
      AI_MAX_CONTEXT_FINDINGS: ${AI_MAX_CONTEXT_FINDINGS:-20}
      AI_MAX_ACTION_PLANS: ${AI_MAX_ACTION_PLANS:-15}
      AI_MAX_EVIDENCE_LINES: ${AI_MAX_EVIDENCE_LINES:-30}
      AI_MAX_RAW_MESSAGE_CHARS: ${AI_MAX_RAW_MESSAGE_CHARS:-300}
      AI_INCLUDE_RAW_LOGS: ${AI_INCLUDE_RAW_LOGS:-false}
      EVENT_RETENTION_LOW_DAYS: ${EVENT_RETENTION_LOW_DAYS:-7}
      EVENT_RETENTION_MEDIUM_DAYS: ${EVENT_RETENTION_MEDIUM_DAYS:-30}
      EVENT_RETENTION_HIGH_DAYS: ${EVENT_RETENTION_HIGH_DAYS:-90}
      EVENT_RETENTION_CRITICAL_DAYS: ${EVENT_RETENTION_CRITICAL_DAYS:-180}
      EVENT_MAX_ROWS: ${EVENT_MAX_ROWS:-200000}
      EVENT_MAX_RAW_SNIPPET_CHARS: ${EVENT_MAX_RAW_SNIPPET_CHARS:-2000}
      EVENT_DEDUP_WINDOW_MINUTES: ${EVENT_DEDUP_WINDOW_MINUTES:-60}
      EVENT_RETENTION_RUN_INTERVAL_MINUTES: ${EVENT_RETENTION_RUN_INTERVAL_MINUTES:-60}
      SSH_CONNECT_TIMEOUT_MS: ${SSH_CONNECT_TIMEOUT_MS:-15000}
      SSH_HANDSHAKE_TIMEOUT_MS: ${SSH_HANDSHAKE_TIMEOUT_MS:-15000}
      SSH_COMMAND_TIMEOUT_MS: ${SSH_COMMAND_TIMEOUT_MS:-10000}
      ACTION_EXECUTION_MODE: ${ACTION_EXECUTION_MODE:-quick_controlled}
      ACTION_REQUIRE_MANAGEMENT_SOURCE: ${ACTION_REQUIRE_MANAGEMENT_SOURCE:-true}
      ACTION_DEFAULT_TRUSTED_SOURCE: ${ACTION_DEFAULT_TRUSTED_SOURCE:-auto}
      ACTION_ALLOW_LAB_UNRESTRICTED_MANAGEMENT: ${ACTION_ALLOW_LAB_UNRESTRICTED_MANAGEMENT:-true}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_DISPLAY_NAME: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:-Administrator}
      BOOTSTRAP_ADMIN_CREDENTIALS_FILE: /app/storage/bootstrap/initial-admin.json
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-}
      AUTH_SESSION_TTL_HOURS: ${AUTH_SESSION_TTL_HOURS:-12}
      AUTH_SESSION_IDLE_MINUTES: ${AUTH_SESSION_IDLE_MINUTES:-120}
      AUTH_MAX_ACTIVE_SESSIONS: ${AUTH_MAX_ACTIVE_SESSIONS:-10}
    expose:
      - "4000"
    volumes:
      - firewall_uploads:/app/storage/uploads
      - firewall_bootstrap:/app/storage/bootstrap
      - firewall_telemetry:/app/storage/telemetry
    labels:
      org.opencontainers.image.revision: ${DEPLOY_VERSION:-local-dev}
      org.opencontainers.image.environment: ${APP_PROFILE:-lab}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  firewall-db:
    image: postgres:18-alpine
    container_name: firewall-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-firewall_log_analyzer}
      POSTGRES_USER: ${POSTGRES_USER:-firewall_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_HOST_AUTH_METHOD: ${POSTGRES_HOST_AUTH_METHOD:-trust}
    volumes:
      - firewall_db_pg18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  firewall_db_pg18_data:
  firewall_uploads:
  firewall_bootstrap:
  firewall_telemetry:
