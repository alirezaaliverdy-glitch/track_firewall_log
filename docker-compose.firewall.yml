services:
  main-nginx:
    image: nginx:1.27-alpine
    container_name: main-nginx
    depends_on:
      firewall-web:
        condition: service_started
      firewall-api:
        condition: service_healthy
    ports:
      - "${FIREWALL_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.firewall-main.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  firewall-web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_BASE_PATH: /firewall/
        VITE_API_BASE_URL: /firewall-api
    container_name: firewall-web
    expose:
      - "50"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:50/firewall/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  firewall-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: firewall-api
    depends_on:
      firewall-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_PROFILE: ${APP_PROFILE:-production}
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN in .env}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      UPLOAD_DIR: /app/storage/uploads
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-openrouter/free}
      OPENAI_FALLBACK_MODELS: ${OPENAI_FALLBACK_MODELS:-nvidia/nemotron-3-super:free,openai/gpt-oss-20b:free,google/gemma-4-31b-it:free}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-30000}
      AI_MAX_CONTEXT_EVENTS: ${AI_MAX_CONTEXT_EVENTS:-25}
      AI_MAX_CONTEXT_INCIDENTS: ${AI_MAX_CONTEXT_INCIDENTS:-10}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?Set CREDENTIAL_ENCRYPTION_KEY in .env}
      ACTION_EXECUTION_MODE: ${ACTION_EXECUTION_MODE:-safe}
      ACTION_REQUIRE_MANAGEMENT_SOURCE: ${ACTION_REQUIRE_MANAGEMENT_SOURCE:-true}
      ACTION_DEFAULT_TRUSTED_SOURCE: ${ACTION_DEFAULT_TRUSTED_SOURCE:-auto}
      ACTION_ALLOW_LAB_UNRESTRICTED_MANAGEMENT: ${ACTION_ALLOW_LAB_UNRESTRICTED_MANAGEMENT:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-Administrator}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:?Set AUTH_SESSION_SECRET in .env}
      AUTH_SESSION_TTL_HOURS: ${AUTH_SESSION_TTL_HOURS:-12}
    expose:
      - "4000"
    volumes:
      - firewall_uploads:/app/storage/uploads
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  firewall-db:
    image: postgres:16-alpine
    container_name: firewall-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-firewall_log_analyzer}
      POSTGRES_USER: ${POSTGRES_USER:-firewall_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - firewall_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  firewall_db_data:
  firewall_uploads:
